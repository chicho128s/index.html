<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Horas y Pago</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --accent: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .paste-card {
      background: #f3e8ff;
      border: 1px solid #d8b4fe;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--primary);
      text-align: center;
    }

    .input-group {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
      background: #ffffff;
    }

    input:focus {
      border-color: var(--primary);
    }

    .day-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .day-row:last-child {
      border-bottom: none;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }

    .day-subtotal {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
    }

    .shift-block {
      background: #f1f5f9;
      padding: 10px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .shift-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .time-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .time-field {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .time-field span {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .summary-card {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .summary-item:last-child {
      margin-bottom: 0;
    }

    .summary-value {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary);
    }

    .summary-value.total-pago {
      color: var(--success);
      font-size: 1.25rem;
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-parse {
      background: var(--accent);
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
    }

    .btn-parse:hover {
      background: #7c3aed;
    }

    .btn-calc {
      background: #2563eb;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .btn-calc:hover {
      background: var(--primary-hover);
    }

    .btn-whatsapp {
      background: #25d366;
      margin-top: 12px;
    }

    .btn-whatsapp:hover {
      background: #1da851;
    }

    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.875rem;
      resize: vertical;
      background: #ffffff;
    }

    textarea.paste-area {
      height: 120px;
      border-color: #c084fc;
    }

    textarea.msg-preview {
      height: 140px;
      background: #f1f5f9;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Calculadora de Trabajo</h1>
    <div class="input-group">
      <label for="hourlyRate">Precio por Hora ($)</label>
      <input type="number" id="hourlyRate" value="3300" oninput="calculateTotals()">
    </div>
  </div>

  <!-- Sección Pegar Texto -->
  <div class="card paste-card">
    <label for="rawSchedule" style="color: #6b21a8; font-weight: 700;">📋 Pegar Texto de Horarios:</label>
    <textarea id="rawSchedule" class="paste-area" placeholder="Pega tu texto de horarios aquí...
Ejemplo:
Martes
9:00–14:00 + 17:35–21:30"></textarea>

    <button type="button" class="btn btn-parse" onclick="processPastedSchedule()">
      ⚡ Desglosar y Calcular
    </button>
  </div>

  <div class="card">
    <h2 style="font-size: 1rem; margin-bottom: 8px;">Horarios Trabajados por Día</h2>
    <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px;">
      Podés editar o cargar manualmente los horarios aquí abajo
    </p>
    
    <!-- Días -->
    <div id="daysContainer"></div>

    <button type="button" class="btn btn-calc" onclick="calculateTotals()">
      📊 Recalcular Horas y Pago
    </button>
  </div>

  <div class="card summary-card">
    <div class="summary-item">
      <span>Total horas:</span>
      <span class="summary-value" id="totalHours">0 hs 0 min</span>
    </div>
    <div class="summary-item">
      <span>Pago estimado:</span>
      <span class="summary-value total-pago" id="totalPayment">$0</span>
    </div>
  </div>

  <div class="card">
    <label for="messagePreview">Mensaje para enviar a Mari:</label>
    <textarea id="messagePreview" class="msg-preview" readonly></textarea>
    
    <button type="button" class="btn btn-whatsapp" onclick="sendWhatsApp()">
      📲 Enviar por WhatsApp
    </button>
    <button type="button" class="btn" style="background: #64748b; margin-top: 8px;" onclick="copyMessage()">
      📋 Copiar Mensaje
    </button>
  </div>
</div>

<script>
  const days = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const container = document.getElementById('daysContainer');

  // Construir campos en pantalla usando inputs de texto estándar para máxima compatibilidad con iOS
  days.forEach((day, idx) => {
    const dayDiv = document.createElement('div');
    dayDiv.className = 'day-row';
    dayDiv.innerHTML = `
      <div class="day-header">
        <span class="day-title">${day}</span>
        <span class="day-subtotal" id="subtotal_${idx}">0 hs 0 min</span>
      </div>
      
      <!-- Turno Mañana -->
      <div class="shift-block">
        <span class="shift-title">Turno Mañana</span>
        <div class="time-inputs">
          <div class="time-field">
            <span>Entrada</span>
            <input type="text" id="m_in_${idx}" placeholder="09:00" oninput="calculateTotals()">
          </div>
          <div class="time-field">
            <span>Salida</span>
            <input type="text" id="m_out_${idx}" placeholder="14:00" oninput="calculateTotals()">
          </div>
        </div>
      </div>

      <!-- Turno Tarde -->
      <div class="shift-block">
        <span class="shift-title">Turno Tarde</span>
        <div class="time-inputs">
          <div class="time-field">
            <span>Entrada</span>
            <input type="text" id="t_in_${idx}" placeholder="17:30" oninput="calculateTotals()">
          </div>
          <div class="time-field">
            <span>Salida</span>
            <input type="text" id="t_out_${idx}" placeholder="21:30" oninput="calculateTotals()">
          </div>
        </div>
      </div>
    `;
    container.appendChild(dayDiv);
  });

  function clearAllInputs() {
    days.forEach((_, idx) => {
      document.getElementById('m_in_' + idx).value = '';
      document.getElementById('m_out_' + idx).value = '';
      document.getElementById('t_in_' + idx).value = '';
      document.getElementById('t_out_' + idx).value = '';
    });
  }

  function cleanTime(tStr) {
    if (!tStr) return '';
    let clean = tStr.trim();
    if (!clean.includes(':') && clean.length > 0) {
      if (clean.length === 1 || clean.length === 2) {
        clean = clean + ':00';
      } else if (clean.length === 3) {
        clean = clean.slice(0,1) + ':' + clean.slice(1);
      } else if (clean.length === 4) {
        clean = clean.slice(0,2) + ':' + clean.slice(2);
      }
    }
    let parts = clean.split(':');
    let h = parts[0].padStart(2, '0');
    let m = parts[1] ? parts[1].padStart(2, '0') : '00';
    return h + ':' + m;
  }

  function parseMinutes(timeStr) {
    if (!timeStr) return -1;
    let clean = cleanTime(timeStr);
    let parts = clean.split(':');
    let h = parseInt(parts[0], 10);
    let m = parseInt(parts[1], 10);
    if (isNaN(h) || isNaN(m)) return -1;
    return h * 60 + m;
  }

  function processPastedSchedule() {
    const raw = document.getElementById('rawSchedule').value;
    if (!raw || !raw.trim()) {
      alert('Por favor, pega el texto con los horarios primero.');
      return;
    }

    clearAllInputs();

    // Reemplazar guiones o separadores especiales por guion simple
    const normalizedText = raw.replace(/[–—]/g, '-');
    const lines = normalizedText.split(/?
/);

    let currentDayIdx = -1;

    lines.forEach(function(line) {
      const trimmed = line.trim();
      if (!trimmed) return;

      const matchedDayIdx = days.findIndex(function(d) {
        const dClean = d.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
        const tClean = trimmed.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
        return tClean.includes(dClean);
      });

      if (matchedDayIdx !== -1) {
        currentDayIdx = matchedDayIdx;
      }

      // Regex flexible para capturar horarios como 9:00-14:00 o 8:30-14:00
      const timeRangeRegex = /(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/g;
      let match;
      let matches = [];
      while ((match = timeRangeRegex.exec(trimmed)) !== null) {
        matches.push(match);
      }

      if (matches.length > 0 && currentDayIdx !== -1) {
        if (matches[0]) {
          document.getElementById('m_in_' + currentDayIdx).value = cleanTime(matches[0][1]);
          document.getElementById('m_out_' + currentDayIdx).value = cleanTime(matches[0][2]);
        }
        if (matches[1]) {
          document.getElementById('t_in_' + currentDayIdx).value = cleanTime(matches[1][1]);
          document.getElementById('t_out_' + currentDayIdx).value = cleanTime(matches[1][2]);
        }
      }
    });

    calculateTotals();
  }

  function getMinutesBetween(timeIn, timeOut) {
    let minsIn = parseMinutes(timeIn);
    let minsOut = parseMinutes(timeOut);

    if (minsIn === -1 || minsOut === -1) return 0;

    if (minsOut < minsIn) {
      minsOut += 24 * 60;
    }

    const diffMins = minsOut - minsIn;
    return diffMins > 0 ? diffMins : 0;
  }

  function formatHM(totalMins) {
    const h = Math.floor(totalMins / 60);
    const m = totalMins % 60;
    if (m === 0) return h + ' hs';
    return h + ' hs ' + m + ' min';
  }

  function calculateTotals() {
    const rate = parseFloat(document.getElementById('hourlyRate').value) || 0;
    let totalMinutesAllDays = 0;
    let details = [];

    days.forEach(function(day, idx) {
      const mIn = document.getElementById('m_in_' + idx).value;
      const mOut = document.getElementById('m_out_' + idx).value;
      const tIn = document.getElementById('t_in_' + idx).value;
      const tOut = document.getElementById('t_out_' + idx).value;

      const mMinutes = getMinutesBetween(mIn, mOut);
      const tMinutes = getMinutesBetween(tIn, tOut);
      const dayTotalMinutes = mMinutes + tMinutes;

      const subElem = document.getElementById('subtotal_' + idx);
      if (subElem) {
        subElem.innerText = dayTotalMinutes > 0 ? formatHM(dayTotalMinutes) : '0 hs 0 min';
      }

      if (dayTotalMinutes > 0) {
        totalMinutesAllDays += dayTotalMinutes;

        let ranges = [];
        if (mMinutes > 0) ranges.push(cleanTime(mIn) + ' a ' + cleanTime(mOut));
        if (tMinutes > 0) ranges.push(cleanTime(tIn) + ' a ' + cleanTime(tOut));

        details.push('- ' + day + ' ' + ranges.join(' '));
      }
    });

    const totalHoursDecimal = totalMinutesAllDays / 60;
    const totalPayment = totalHoursDecimal * rate;

    document.getElementById('totalHours').innerText = formatHM(totalMinutesAllDays);
    document.getElementById('totalPayment').innerText = '$' + Math.round(totalPayment).toLocaleString('es-AR');

    let msg = 'Hola Mari los días trabajados y las horas son:

';
    if (details.length > 0) {
      msg += details.join('
') + '

';
    } else {
      msg += '(Aún no ingresaste horarios)

';
    }
    msg += 'Total de horas: ' + formatHM(totalMinutesAllDays) + '
';
    msg += 'Total a cobrar: $' + Math.round(totalPayment).toLocaleString('es-AR');

    document.getElementById('messagePreview').value = msg;
  }

  function sendWhatsApp() {
    const msg = encodeURIComponent(document.getElementById('messagePreview').value);
    window.open('https://wa.me/?text=' + msg, '_blank');
  }

  function copyMessage() {
    const textarea = document.getElementById('messagePreview');
    textarea.select();
    document.execCommand('copy');
    alert('¡Mensaje copiado al portapapeles!');
  }

  calculateTotals();
</script>

</body>
</html>
